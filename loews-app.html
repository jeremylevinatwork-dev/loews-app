<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Loews Hotels Security Orlando</title>
<meta name="theme-color" content="#1a365d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loews Hotels Security Orlando">
<link rel="manifest" href="loews-manifest.json">
<style>
:root{--gold:#d4af37;--navy:#1a365d;--blue:#2d4a7a;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0f2440;color:#222;min-height:100vh;min-height:100dvh;overflow:hidden;}

/* ---------- login (matches previous design) ---------- */
#uni-login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a365d 0%,#2d4a7a 100%);z-index:9999;padding:16px;}
.uni-card{background:#fff;border-radius:16px;padding:32px 28px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center;}
.uni-card h1{color:#1a365d;font-size:24px;margin:12px 0 4px;}
.uni-card .sub{color:#666;font-size:14px;margin-bottom:20px;}
.uni-card select,.uni-card input{width:100%;padding:12px;margin:8px 0;border:2px solid #d4af37;border-radius:8px;font-size:16px;background:#fff;color:#222;}
.uni-card button{width:100%;padding:14px;margin-top:12px;background:#d4af37;color:#1a365d;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;}
.uni-card button:hover{background:#c09f2e;}
.uni-err{color:#c53030;font-size:13px;min-height:18px;}
.brand-power{font-family:Georgia,'Times New Roman',serif;font-weight:bold;color:#111;font-size:17px;margin:10px 0 2px;}
.brand-prod{position:fixed;left:12px;bottom:10px;color:rgba(255,255,255,.75);font-size:12px;z-index:9998;}

/* ---------- app shell ---------- */
#app-shell{display:none;height:100vh;height:100dvh;flex-direction:column;background:#0f2440;}
#app-shell.on{display:flex;}
.app-header{flex:0 0 54px;background:linear-gradient(135deg,#1a365d,#2d4a7a);color:#fff;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);}
.app-header h2{font-size:17px;letter-spacing:.3px;}
.app-header .who{font-size:12px;opacity:.85;margin-left:8px;}
.app-header .hleft{display:flex;align-items:center;min-width:0;}
.app-header .hleft span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app-header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px;flex-shrink:0;}
.tabpages{flex:1;position:relative;min-height:0;background:#fff;}
.tabpage{position:absolute;inset:0;display:none;}
.tabpage.active{display:block;}
.tabpage iframe{width:100%;height:100%;border:0;display:block;background:#fff;}
.tabbar{flex:0 0 64px;display:flex;background:#fff;border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;border:none;background:#fff;font-size:13px;font-weight:bold;color:#5b6b80;cursor:pointer;border-top:3px solid transparent;margin-top:-3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.tabbar button .ico{font-size:20px;}
.tabbar button.active{color:#1a365d;border-top:3px solid var(--gold);background:#f7f3e3;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="uni-login">
  <div class="uni-card">
    <div class="brand-power">Power by: NDL systems tech</div>
    <h1>Loews Security Systems</h1>
    <div class="sub">Team Login — Fobs · Cameras · Radios · Chat · Clients · Inspections</div>
    <select id="uni-name">
      <option value="">-- Select Your Name --</option>
      <option value="Jeremy Levin">Jeremy Levin</option>
      <option value="Alexander Duff">Alexander Duff</option>
      <option value="Dominique Black">Dominique Black</option>
      <option value="Sean Forester">Sean Forester</option>
      <option value="Justin Messger">Justin Messger</option>
    </select>
    <input type="password" id="uni-pin" placeholder="Enter Team PIN" inputmode="numeric" autocomplete="off">
    <div class="uni-err" id="uni-err"></div>
    <button onclick="uniLogin()">Log in</button>
  </div>
</div>
<div class="brand-prod">Produced by: JHNL Security Tech</div>

<!-- ================= APP SHELL ================= -->
<div id="app-shell">
  <div class="app-header">
    <div class="hleft"><h2>Loews Security</h2><span class="who" id="whoami"></span></div>
    <button onclick="uniLogout()">Log out</button>
  </div>
  <div class="tabpages">
    <div class="tabpage active" id="page-fobs"><iframe id="frame-fobs" title="Secure Alert — Fobs" allow="camera; microphone; geolocation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
    <div class="tabpage" id="page-cams"><iframe id="frame-cams" title="Camera Tracking" allow="camera; microphone; geolocation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
    <div class="tabpage" id="page-radio"><iframe id="frame-radio" title="Radio Tracking" allow="camera; microphone; geolocation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
    <div class="tabpage" id="page-chat"><iframe id="frame-chat" title="Team Chat" allow="camera; microphone; geolocation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
    <div class="tabpage" id="page-clients"><iframe id="frame-clients" title="Client Portal" allow="camera; microphone; geolocation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
    <div class="tabpage" id="page-inspect"><iframe id="frame-inspect" title="Daily Inspections" allow="camera; microphone; geolocation" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
  </div>
  <div class="tabbar">
    <button data-tab="fobs" class="active" onclick="switchTab('fobs')"><span class="ico">🔐</span>Fobs</button>
    <button data-tab="cams" onclick="switchTab('cams')"><span class="ico">📷</span>Cameras</button>
    <button data-tab="radio" onclick="switchTab('radio')"><span class="ico">📻</span>Radios</button>
    <button data-tab="chat" onclick="switchTab('chat')"><span class="ico">💬</span>Chat</button>
    <button data-tab="clients" onclick="switchTab('clients')"><span class="ico">🏨</span>Clients</button>
    <button data-tab="inspect" onclick="switchTab('inspect')"><span class="ico">📋</span>Inspect</button>
  </div>
</div>

<script>
var TEAM_PINS = {
  "Jeremy Levin": "1245",
  "Alexander Duff": "0132",
  "Dominique Black": "2195",
  "Sean Forester": "3867",
  "Justin Messger": "5132"
};
var APP_URLS = {
  fobs:  "https://jeremylevinatwork-dev.github.io/secure-alert/",
  cams:  "https://jeremylevinatwork-dev.github.io/camera-tracking/",
  radio: "https://jeremylevinatwork-dev.github.io/radio-tracking/",
  chat:  "https://jeremylevinatwork-dev.github.io/team-chat/",
  clients: "https://jeremylevinatwork-dev.github.io/secure-alert-customer/",
  inspect: "https://jeremylevinatwork-dev.github.io/daily-inspections/"
};
var loadedTabs = {};

function writeSSO(name){
  try{
    localStorage.setItem('loewsAuth','1');
    localStorage.setItem('loewsUser', name);
  }catch(e){}
}

function loadTab(which){
  if(loadedTabs[which]) return;
  loadedTabs[which] = true;
  var frame = document.getElementById('frame-' + which);
  if(frame && APP_URLS[which]) frame.src = APP_URLS[which];
}

function switchTab(which){
  document.querySelectorAll('.tabbar button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === which);
  });
  document.querySelectorAll('.tabpage').forEach(function(p){
    p.classList.toggle('active', p.id === 'page-' + which);
  });
  loadTab(which); /* lazy-load on first visit; SSO keys already in localStorage */
}

function showShell(name){
  document.getElementById('uni-login').style.display = 'none';
  document.getElementById('app-shell').classList.add('on');
  document.getElementById('whoami').textContent = name ? ('· ' + name) : '';
  switchTab('fobs');
}

function uniLogin(){
  var name = document.getElementById('uni-name').value;
  var pin = document.getElementById('uni-pin').value.trim();
  var err = document.getElementById('uni-err');
  if(!name){ err.textContent = 'Select your name.'; return; }
  if(TEAM_PINS[name] !== pin){ err.textContent = 'Wrong PIN — try again.'; return; }
  err.textContent = '';
  writeSSO(name);          /* SSO written BEFORE any iframe loads */
  showShell(name);
}

function uniLogout(){
  try{ localStorage.removeItem('loewsAuth'); localStorage.removeItem('loewsUser'); }catch(e){}
  /* unload iframes so next login re-checks SSO cleanly */
  ['fobs','cams','radio','chat','clients','inspect'].forEach(function(which){
    loadedTabs[which] = false;
    var frame = document.getElementById('frame-' + which);
    if(frame) frame.removeAttribute('src');
  });
  document.getElementById('app-shell').classList.remove('on');
  document.getElementById('uni-login').style.display = 'flex';
  document.getElementById('uni-pin').value = '';
  document.getElementById('uni-err').textContent = '';
}

/* Enter key submits PIN */
document.getElementById('uni-pin').addEventListener('keypress', function(e){
  if(e.key === 'Enter') uniLogin();
});

/* Auto-login if a previous SSO session exists */
(function(){
  try{
    if(localStorage.getItem('loewsAuth') === '1' && localStorage.getItem('loewsUser')){
      var name = localStorage.getItem('loewsUser');
      var sel = document.getElementById('uni-name');
      for(var i = 0; i < sel.options.length; i++){
        if(sel.options[i].value === name){ sel.selectedIndex = i; break; }
      }
      showShell(name);
    }
  }catch(e){}
})();
</script>
</body>
</html>
